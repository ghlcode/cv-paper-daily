name: Daily CV Papers

on:
  schedule:
    # UTC 00:23 = 08:23 (UTC+8). Avoid the top of the hour: GitHub delays
    # scheduled jobs that fire exactly on popular cron boundaries.
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      max_results:
        description: 'Number of recent arXiv entries to request (paged)'
        required: false
        default: '800'
        type: string
      lookback_days:
        description: 'Calendar-day window for unseen papers'
        required: false
        default: '7'
        type: string

permissions:
  contents: write

concurrency:
  group: daily-cv-papers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest cs.CV papers from arXiv
        run: |
          python scripts/fetch_papers.py \
            --max-results "${{ inputs.max_results || '800' }}" \
            --lookback-days "${{ inputs.lookback_days || '7' }}"

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --staged --quiet; then
            echo "No new papers or metadata changes, skipping commit."
            exit 0
          fi
          git commit -m "chore: daily CV papers $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push
